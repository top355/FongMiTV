# 放到 top355/FongMiTV 分叉的 .github/workflows/build.yml
# AAR 来源三选一，脚本会自动判断，不用你改：
#   1) app/libs 里已经自带（git add -f 提交进去的）→ 直接用
#   2) 没有 → 从下面 MEDIA_REPO 的 Release 资产 media3-aars.zip 下载（默认 <你的用户名>/media）
#   3) 想换来源 → 在仓库 Settings → Variables 里加 MEDIA_REPO=<owner>/<repo>
name: Build FongMi TV APK

on:
  push:
    branches: [fongmi, main]
    tags: ['v*']          # 只写 branches 时推标签不触发；两类都要写才都触发
  workflow_dispatch:
    inputs:
      tv_ref:
        # ⚠️ 别随手改成 fongmi/HEAD。2026-08-27 的 b9455fb（Integrate libass and advanced
        #    subtitle controls）起，TV 源码开始 import androidx.media3.exoplayer.libass.*、
        #    androidx.media3.ui.libass.*、SecondaryTextOutput/SecondaryTextTrackSelector、
        #    DanmakuPlayerViewController —— 这些类在 FongMi/media 的所有公开分支里都不存在
        #    （上游 media 仓库最后推送 2026-08-14，fongmi 分支 HEAD 停在 07-27）。
        #    所以能编的最后一个提交是 b9455fb 的父提交 fe6a5b23（08-27）。
        #    等哪天上游 media 更新了，把这个默认值换回 fongmi 分支即可。
        description: 'TV 源码提交/分支（默认 = 与 7 月版 media3 兼容的最后一个提交）'
        required: false
        default: 'fe6a5b235477c02633cf3bc50d4cd83414a521b4'

permissions:
  contents: write         # 发 Release 必须显式给，否则报 403 Resource not accessible

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # 20 个播放器 AAR 从哪来。默认取「你自己的 media 分叉」的同名仓库。
  # 内置 media 的 Release 资产名固定是 media3-aars.zip，标签固定是 libs（由 build-aars.yml 产出）。
  MEDIA_REPO: ${{ vars.MEDIA_REPO || format('{0}/media', github.repository_owner) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码（默认钉在最后一个媒体3兼容提交上，见 workflow 顶部说明）
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tv_ref || 'fe6a5b235477c02633cf3bc50d4cd83414a521b4' }}

      # ⚠️ 必须在任何 ./gradlew 之前跑完。
      #    Windows 上 git 默认 core.fileMode=false，提交上去的 gradlew 记录的是 644；
      #    Linux runner 上直接 ./gradlew 就是「Permission denied」→ 步骤退出码 126。
      - name: 环境自检（gradlew 可执行位 + gradle.properties 不许出现本机绝对路径）
        run: |
          set -e
          # 想在仓库层面根治（一次就够，之后 clone 下来就带可执行位）：
          #   git update-index --chmod=+x gradlew && git commit -m "gradlew +x"
          # 下面这行是兜底，确保即使仓库里仍是 644 也能跑。
          [ -f gradlew ] || { echo "::error::仓库根目录没有 gradlew"; exit 1; }
          chmod +x gradlew
          echo "gradlew 权限: $(stat -c '%A' gradlew)（必须是 rwx 开头）"
          if grep -nE '^[[:space:]]*[^#[:space:]][^=]*=[[:space:]]*[A-Za-z]:[\\/]' gradle.properties; then
            echo "::error::gradle.properties 里有 Windows 专属绝对路径，Linux runner 上 gradle 会立刻退出 1"
            exit 1
          fi
          echo "wrapper: $(grep distributionUrl gradle/wrapper/gradle-wrapper.properties)"

      # app/libs/.gitignore 里那一行 lib-*.aar 把这些 AAR 全挡在仓库外了，所以要么提交进去（-f），要么在这里拉。
      - name: 取回播放器 AAR（来自 media 分叉的 Release 资产）
        run: |
          set -e
          if [ -f app/libs/lib-common-release.aar ]; then
            echo "app/libs 已自带 AAR，跳过下载"
            exit 0
          fi
          URL="https://github.com/$MEDIA_REPO/releases/download/libs/media3-aars.zip"
          echo "下载 $URL"
          curl -fL --retry 3 --retry-delay 5 --max-time 600 -o "$RUNNER_TEMP/media3-aars.zip" "$URL"
          python3 - <<'PY'
          import zipfile, os
          os.makedirs("app/libs", exist_ok=True)
          z = zipfile.ZipFile(os.environ["RUNNER_TEMP"] + "/media3-aars.zip")
          z.extractall("app/libs")
          print("解出", len(z.namelist()), "个文件")
          PY
          ls -l app/libs/*.aar | awk '{printf "%8.1f MB  %s\n", $5/1048576, $9}'

      - name: 缓存 AAR（约 120 MB；缓存挂了不影响构建）
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: app/libs
          key: media3-aars-${{ env.MEDIA_REPO }}-${{ github.run_id }}
          restore-keys: |
            media3-aars-${{ env.MEDIA_REPO }}-

      - name: 校验播放器 AAR 是否齐全（缺一个都编不过，早失败早明白）
        run: |
          set -e
          need="lib-common lib-container lib-database lib-datasource lib-datasource-okhttp lib-datasource-rtmp lib-decoder lib-decoder-ffmpeg lib-decoder-mpegh lib-effect lib-exoplayer lib-exoplayer-dash lib-exoplayer-hls lib-exoplayer-rtsp lib-exoplayer-smoothstreaming lib-extractor lib-mpvplayer lib-session lib-ui lib-ui-danmaku"
          miss=""
          for n in $need; do
            [ -f "app/libs/$n-release.aar" ] || miss="$miss $n"
          done
          if [ -n "$miss" ]; then
            echo "::error::app/libs 缺少播放器依赖:$miss"
            echo "两个可能：① 上一步下载失败（$MEDIA_REPO 的 Release 里还没有 media3-aars.zip）；"
            echo "② 下载到的 AAR 集合太老/太新，模块名对不上这份源码。"
            echo "修法见 README 的 B 路线：先在 media 分叉里跑 build-aars.yml，再回来跑这个。"
            exit 1
          fi
          echo "OK：20 个播放器 AAR 齐全"
          ls -l app/libs/*.aar | awk '{print $5, $9}'

      # ⚠️ 让「AAR 与源码版本错配」在 10 秒内暴露，而不是编到 1 分钟后甩出几十条
      #    "package androidx.media3.exoplayer.libass does not exist" 让你猜。
      #    原理：TV 源码里出现的每个 import androidx.media3.* 都要能在 app/libs 的 AAR 里找到。
      #    实测撞到过：TV 的 b9455fb(2026-08-27) 引入 libass 等 8 个新类，而上游 media 仓库
      #    最后推送是 2026-08-14 —— 版本对不上，编译必红（见 README §4.9）。
      - name: 校验 AAR 是否覆盖 TV 源码用到的 media3 类（版本错配防呆）
        run: |
          set -e
          python3 - <<'PY'
          import io, os, re, sys, zipfile

          # ① 源码侧：收集所有 import 的 media3 类（去掉内部类的 $ 后缀）
          need = {}
          for root, _, files in os.walk("app/src"):
              for f in files:
                  if not f.endswith(".java"):
                      continue
                  p = os.path.join(root, f)
                  txt = io.open(p, encoding="utf-8", errors="replace").read()
                  for m in re.finditer(
                          r"^\s*import\s+(?:static\s+)?(androidx\.media3\.[\w.$]+)\s*;", txt, re.M):
                      need.setdefault(m.group(1).split("$")[0], []).append(p)

          # ② AAR 侧：汇总所有 classes.jar 里的类名
          have = set()
          for a in sorted(os.listdir("app/libs")):
              if not a.endswith(".aar"):
                  continue
              with zipfile.ZipFile("app/libs/" + a) as z:
                  for n in z.namelist():
                      if n == "classes.jar":
                          with zipfile.ZipFile(io.BytesIO(z.read(n))) as j:
                              have |= {x[:-6].replace("/", ".")
                                       for x in j.namelist() if x.endswith(".class")}

          # R 类是构建时生成的（源码树里没有同名文件），按类名后缀放过
          missing = {c: v for c, v in need.items()
                     if c not in have and c.rsplit(".", 1)[-1] != "R"}
          print(f"TV 源码引用 media3 类 {len(need)} 个；app/libs 提供 {len(have)} 个")
          if missing:
              print("::error::以下类在 app/libs 的 AAR 里找不到 —— AAR 集合与这份源码不是同一版本")
              for c in sorted(missing):
                  print(f"  x {c}   <- {missing[c][0]}")
              print("多半是 TV 源码比 media 分支新（上游没公开配套 media3）。")
              print("把 workflow 顶部 tv_ref 换成更早的提交，或等上游 media 更新。")
              sys.exit(1)
          print("OK：TV 源码用到的 media3 类在 AAR 里全部命中")
          PY

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Chaquopy 17 起 buildPython 必须与 app 的 python 版本 major.minor 一致（chaquo/build.gradle 里是 3.10）
      - name: Python 3.10
        uses: actions/setup-python@v6        # v6 = 首个 node24（已核对 action.yml 的 runs.using）
        with:
          python-version: '3.10'
      - name: 确认 Chaquopy 能找到匹配的 build Python
        run: |
          set -e
          python3 --version
          python3.10 --version 2>/dev/null || echo "无 python3.10 命令 → Chaquopy 会退回 python3（同样是 3.10）"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      # ⚠️ 平台包名不能写死：API 37 起 Google 强制带次版本号，官方仓库里只有
      #    platforms;android-37.0 / 37.1 / 37.2，【没有 platforms;android-37】——
      #    写 android-37 会直接报 "Failed to find package 'platforms;android-37'"。
      #    36 及以前是不带小数的老编号（platforms;android-36 才有）。
      #    所以这里从工程自己的 libs.versions.toml 读 compileSdk，再按编号规则试候选。
      - name: 安装 Android SDK（平台包名按编号规则解析，不写死）
        run: |
          set -e
          CS=$(grep -m1 -E '^compileSdk(Version)?[[:space:]]*=' gradle/libs.versions.toml | grep -oE '[0-9]+' | head -1)
          test -n "$CS" || { echo "::error::没从 gradle/libs.versions.toml 读到 compileSdk"; exit 1; }
          echo "工程 compileSdk = $CS"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          echo "sdkmanager: $SDKMGR"

          # 'yes: standard output: Broken pipe' 是正常现象（sdkmanager 收够 y 就退出了），不是错误
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" > /dev/null 2>&1 || true

          # 37 起是新编号（带 .0），36 及以前是老编号（不带）→ 先试更可能的那个，装不上再试另一个。
          # 判据一律看目录在不在（sdkmanager 的退出码不完全可靠）。
          if [ "$CS" -ge 37 ] 2>/dev/null; then
            CANDS="platforms;android-$CS.0 platforms;android-$CS"
          else
            CANDS="platforms;android-$CS platforms;android-$CS.0"
          fi
          PLAT=""
          for cand in $CANDS; do
            "$SDKMGR" "$cand" > /dev/null 2>&1 || true
            if ls -d "$ANDROID_HOME/platforms/android-$CS"* > /dev/null 2>&1; then PLAT="$cand"; break; fi
            echo "  ⚠️ $cand 装不上，换下一个候选"
          done
          if [ -z "$PLAT" ]; then
            echo "::error::API $CS 的平台装不上（候选都试过了）"
            echo "platforms/ 目录里现在有："; ls "$ANDROID_HOME/platforms" || true
            exit 1
          fi
          echo "✅ 平台包 $PLAT 已就绪"
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms"

          # build-tools 交给 AGP 兜底：这边装不上只当警告，AGP 会自己下它需要的那个版本
          "$SDKMGR" "build-tools;$CS.0.0" > /dev/null 2>&1 || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools"

      # app/build.gradle 在【配置阶段】就 file('local.properties') 读签名，文件缺失或字段为空连 debug 都配置不过
      - name: 生成 CI 签名与 local.properties
        run: |
          set -e
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storetype PKCS12 \
            -alias ci -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android123 -keypass android123 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=CN"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=$RUNNER_TEMP/ci.jks"
            echo "keyAlias=ci"
            echo "storePassword=android123"
          } > local.properties
          sed 's/android123/******/' local.properties

      - name: 编译（TV 版 + 手机版，按 ABI 分包）
        run: |
          set -e
          chmod +x ./gradlew          # 每个 step 是独立 shell，这里再兜一次底（幂等；根治看上面「环境自检」）
          ./gradlew --version         # 权限 / CRLF / 缺解释器都在这一行炸，报错比在管道里看得清
          # lintVital 带 flavor 名，任务名不确定 → 先问它是谁，再决定跳哪些（-x 写错名字会报 Task not found）
          # 探测失败不算错误：grep 没匹配到时返回 1，不该拖垮整个构建（-x 只是省时间的优化）
          { ./gradlew :app:tasks --all --console=plain -q \
              | grep -oE 'lintVital[A-Za-z]*Release' | sort -u | sed 's/^/-x /' | tr '\n' ' ' > /tmp/skip.txt ; } || true
          echo "跳过：$(cat /tmp/skip.txt 2>/dev/null)"
          ./gradlew :app:assembleLeanbackRelease :app:assembleMobileRelease \
            $(cat /tmp/skip.txt 2>/dev/null) --no-daemon --console=plain

      - name: 清点产物
        run: |
          set -e
          ls -l Release/apk
          sha256sum Release/apk/*.apk | tee Release/apk/SHA256SUMS.txt

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fongmitv-apk
          path: |
            Release/apk/*.apk
            Release/apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: 推标签时发布到 Releases（幂等）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          {
            echo "## $TAG"
            echo
            echo '```'
            cat Release/apk/SHA256SUMS.txt
            echo '```'
            echo
            echo "- 构建提交: $GITHUB_SHA"
          } > /tmp/notes.md
          ASSETS=""
          for f in Release/apk/leanback-arm64_v8a.apk Release/apk/leanback-armeabi_v7a.apk \
                   Release/apk/mobile-arm64_v8a.apk Release/apk/mobile-armeabi_v7a.apk; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber      # create 没有 --clobber，已存在只能走 upload
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/notes.md $ASSETS
          fi
